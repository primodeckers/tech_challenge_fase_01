[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-challenge-fase-01"
version = "0.1.0"
description = "Tech Challenge FIAP Fase 1 — previsão de churn (MLP, MLflow, FastAPI)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "mlflow>=2.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pandera>=0.20",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

# X, y e make_X_y alinham com a convenção Scikit-Learn / literatura ML.
[tool.ruff.lint.per-file-ignores]
"src/churn_prediction/datasets.py" = ["N802", "N803", "N806"]
"src/churn_prediction/baselines.py" = ["N803"]
"tests/test_datasets.py" = ["N803", "N806"]
"tests/test_baselines.py" = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"
